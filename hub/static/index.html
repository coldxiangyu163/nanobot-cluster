<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nanobot Cluster Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0e17;color:#e0e0e0;overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:320px;background:#111827;border-right:1px solid #1f2937;display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;position:relative}
.logo{padding:20px;border-bottom:1px solid #1f2937;display:flex;align-items:center;gap:10px}
.logo h1{font-size:18px;font-weight:600;color:#f9fafb}
.logo span{font-size:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px}
.stat{background:#1a2332;border-radius:8px;padding:12px;text-align:center}
.stat .num{font-size:24px;font-weight:700;color:#60a5fa}
.stat .label{font-size:11px;color:#9ca3af;margin-top:2px}
.stat.online .num{color:#34d399}
.stat.offline .num{color:#f87171}
.stat.busy .num{color:#fbbf24}
#agent-list{flex:1;overflow-y:auto;padding:8px}
.agent-card{background:#1a2332;border-radius:8px;padding:14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.agent-card:hover{border-color:#3b82f6}
.agent-card.selected{border-color:#3b82f6;background:#1e293b}
.agent-card .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.agent-card .focus{font-size:12px;color:#9ca3af;margin-top:4px}
.agent-card .caps{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.agent-card .cap{font-size:10px;background:#374151;color:#d1d5db;padding:2px 8px;border-radius:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.online,.dot.idle{background:#34d399}
.dot.busy{background:#fbbf24}
.dot.offline{background:#f87171}
#canvas{width:100%;height:100%}
.node{cursor:pointer}
.node circle{stroke-width:3;transition:all .3s}
.node text{fill:#e0e0e0;font-size:12px;font-weight:500}
.link{stroke:#374151;stroke-width:2;stroke-dasharray:6,3}
.link.active{stroke:#3b82f6;stroke-dasharray:none;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#detail-panel{position:absolute;top:16px;right:16px;width:340px;background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px;display:none}
#detail-panel.show{display:block}
#detail-panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
#detail-panel .info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1f2937;font-size:13px}
#detail-panel .info-row .label{color:#9ca3af}
#task-input{display:flex;gap:8px;margin-top:16px}
#task-input input{flex:1;background:#1a2332;border:1px solid #374151;border-radius:6px;padding:8px 12px;color:#e0e0e0;font-size:13px;outline:none}
#task-input input:focus{border-color:#3b82f6}
#task-input button{background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;white-space:nowrap}
#task-input button:hover{background:#2563eb}
.empty-state{text-align:center;padding:60px 20px;color:#6b7280}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state p{font-size:14px;line-height:1.6}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#34d399;color:#000;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;display:none;z-index:999}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="logo"><span>🤖</span><h1>Nanobot Cluster</h1></div>
    <div class="stats">
      <div class="stat"><div class="num" id="s-total">0</div><div class="label">Total</div></div>
      <div class="stat online"><div class="num" id="s-online">0</div><div class="label">Online</div></div>
      <div class="stat busy"><div class="num" id="s-busy">0</div><div class="label">Busy</div></div>
      <div class="stat offline"><div class="num" id="s-offline">0</div><div class="label">Offline</div></div>
    </div>
    <div id="agent-list"></div>
  </div>
  <div id="main">
    <svg id="canvas"></svg>
    <div id="detail-panel">
      <h3><span class="dot" id="dp-dot"></span><span id="dp-name"></span></h3>
      <div class="info-row"><span class="label">ID</span><span id="dp-id"></span></div>
      <div class="info-row"><span class="label">Status</span><span id="dp-status"></span></div>
      <div class="info-row"><span class="label">Focus</span><span id="dp-focus"></span></div>
      <div class="info-row"><span class="label">Capabilities</span><span id="dp-caps"></span></div>
      <div class="info-row"><span class="label">Registered</span><span id="dp-reg"></span></div>
      <div class="info-row"><span class="label">Last Heartbeat</span><span id="dp-hb"></span></div>
      <div class="info-row"><span class="label">Tasks</span><span id="dp-tasks"></span></div>
      <div id="task-input">
        <input type="text" id="task-desc" placeholder="Dispatch a task...">
        <button onclick="dispatchTask()">Send</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const API = '';
let agents = [];
let selectedId = null;

async function fetchAgents() {
  try {
    const r = await fetch(`${API}/api/agents`);
    const d = await r.json();
    agents = d.agents || [];
    updateStats();
    renderList();
    renderTopology();
  } catch(e) { console.error('Fetch error:', e); }
}

function updateStats() {
  document.getElementById('s-total').textContent = agents.length;
  document.getElementById('s-online').textContent = agents.filter(a => a.status === 'online' || a.status === 'idle').length;
  document.getElementById('s-busy').textContent = agents.filter(a => a.status === 'busy').length;
  document.getElementById('s-offline').textContent = agents.filter(a => a.status === 'offline').length;
}

function renderList() {
  const el = document.getElementById('agent-list');
  if (!agents.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🔌</div><p>No agents registered yet.<br>Start an agent with:<br><code>python -m agent.client -c agent.yaml</code></p></div>';
    return;
  }
  el.innerHTML = agents.map(a => `
    <div class="agent-card ${a.id === selectedId ? 'selected' : ''}" onclick="selectAgent('${a.id}')">
      <div class="name"><span class="dot ${a.status}"></span>${a.name}</div>
      <div class="focus">${a.focus || 'No focus set'}</div>
      <div class="caps">${(a.capabilities||[]).map(c => `<span class="cap">${c}</span>`).join('')}</div>
    </div>
  `).join('');
}

function selectAgent(id) {
  selectedId = id;
  const a = agents.find(x => x.id === id);
  if (!a) return;
  const p = document.getElementById('detail-panel');
  p.classList.add('show');
  document.getElementById('dp-dot').className = `dot ${a.status}`;
  document.getElementById('dp-name').textContent = a.name;
  document.getElementById('dp-id').textContent = a.id;
  document.getElementById('dp-status').textContent = a.status;
  document.getElementById('dp-focus').textContent = a.focus || '-';
  document.getElementById('dp-caps').textContent = (a.capabilities||[]).join(', ') || '-';
  document.getElementById('dp-reg').textContent = timeAgo(a.registered_at);
  document.getElementById('dp-hb').textContent = timeAgo(a.last_heartbeat);
  document.getElementById('dp-tasks').textContent = a.current_tasks || 0;
  renderList();
  highlightNode(id);
}

async function dispatchTask() {
  if (!selectedId) return;
  const desc = document.getElementById('task-desc').value.trim();
  if (!desc) return;
  try {
    await fetch(`${API}/api/agents/${selectedId}/tasks`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({description: desc})
    });
    document.getElementById('task-desc').value = '';
    showToast(`Task dispatched to ${selectedId}`);
  } catch(e) { showToast('Failed to dispatch task'); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function timeAgo(ts) {
  if (!ts) return '-';
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

// --- Topology SVG ---
function renderTopology() {
  const svg = document.getElementById('canvas');
  const W = svg.clientWidth || 800;
  const H = svg.clientHeight || 600;
  const cx = W / 2, cy = H / 2;

  let html = '';
  // Hub node
  html += `<g class="node hub" transform="translate(${cx},${cy})">`;
  html += `<circle r="36" fill="#1e293b" stroke="#3b82f6"/>`;
  html += `<text text-anchor="middle" dy="5" fill="#60a5fa" font-size="14" font-weight="700">Hub</text>`;
  html += `</g>`;

  const n = agents.length;
  agents.forEach((a, i) => {
    const angle = (2 * Math.PI * i / Math.max(n, 1)) - Math.PI / 2;
    const r = Math.min(W, H) * 0.32;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    const colors = {online:'#34d399',idle:'#34d399',busy:'#fbbf24',offline:'#4b5563'};
    const sc = colors[a.status] || '#4b5563';
    const active = a.status !== 'offline' ? 'active' : '';

    html += `<line class="link ${active}" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    html += `<g class="node" id="node-${a.id}" transform="translate(${x},${y})" onclick="selectAgent('${a.id}')">`;
    html += `<circle r="28" fill="#1a2332" stroke="${sc}"/>`;
    html += `<text text-anchor="middle" dy="-6" font-size="11">${a.name}</text>`;
    html += `<text text-anchor="middle" dy="10" font-size="9" fill="#9ca3af">${a.status}</text>`;
    html += `</g>`;
  });

  svg.innerHTML = html;
}

function highlightNode(id) {
  document.querySelectorAll('.node circle').forEach(c => c.style.filter = '');
  const node = document.getElementById(`node-${id}`);
  if (node) node.querySelector('circle').style.filter = 'drop-shadow(0 0 8px #3b82f6)';
}

// --- Init ---
fetchAgents();
setInterval(fetchAgents, 5000);
window.addEventListener('resize', renderTopology);
document.getElementById('canvas').addEventListener('click', (e) => {
  if (e.target === e.currentTarget || e.target.tagName === 'svg') {
    selectedId = null;
    document.getElementById('detail-panel').classList.remove('show');
    renderList();
  }
});
</script>
</body>
</html>
